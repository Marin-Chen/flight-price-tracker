<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>機票價格追蹤｜TPE ⇄ LAX</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.8/dist/chart.umd.min.js"></script>
<style>
:root{font-family:system-ui,"Noto Sans TC",sans-serif;color:#e8eef9;background:#0b1220}body{margin:0}main{max-width:1100px;margin:auto;padding:30px 18px}h1{font-size:clamp(24px,4vw,36px);margin-bottom:8px}.sub{color:#aebbd2}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:24px 0}.card,.panel{background:#151f32;border:1px solid #2b3b55;border-radius:14px;padding:18px}.stat{font-size:clamp(19px,3vw,28px);font-weight:700;margin-top:10px}.label{color:#b9c5d8;font-size:13px}.panel{margin:14px 0}.chartbox{height:380px}table{width:100%;border-collapse:collapse}td,th{padding:12px;text-align:left;border-bottom:1px solid #2b3b55}th{color:#aebbd2}select,button{background:#233450;color:white;border:1px solid #405473;padding:10px;border-radius:8px;cursor:pointer}.note{color:#aebbd2;font-size:13px;line-height:1.7}a{color:#83caff}@media(max-width:650px){.stats{grid-template-columns:1fr}.chartbox{height:300px}td,th{font-size:12px;padding:8px}}
</style></head><body><main>
<h1>✈️ 美國機票價格追蹤</h1>
<div class="sub">桃園 TPE ⇄ 洛杉磯 LAX｜12/24 去程｜1/2 回程｜1/3 抵台｜2 位成人｜直飛經濟艙</div>
<div class="stats"><div class="card"><div class="label">最新可用最低價／人</div><div class="stat" id="latest">—</div></div><div class="card"><div class="label">歷史最低價／人</div><div class="stat" id="lowest">—</div></div><div class="card"><div class="label">目標價／人</div><div class="stat">NT$26,000</div></div></div>
<section class="panel"><label for="airline">航空公司：</label> <select id="airline"><option value="ALL">全部</option><option value="長榮 EVA Air">長榮</option><option value="華航 China Airlines">華航</option><option value="星宇 STARLUX">星宇</option></select><p id="updated" class="note">讀取中…</p><div class="chartbox"><canvas id="chart"></canvas></div></section>
<section class="panel"><h2>各航空公司最新可用紀錄</h2><div style="overflow-x:auto"><table><thead><tr><th>航空公司</th><th>價格／人</th><th>查價時間</th><th>去／回程航班</th></tr></thead><tbody id="rows"></tbody></table></div><p class="note">價格為兩人來回總價除以二。三家航空公司分時段輪流查詢，並非同時報價。</p><button id="download">下載歷史 CSV</button></section>
<p class="note">資料來源：SerpApi / Google Flights。未驗證托運行李費用、最終稅費與訂票可用性；僅供價格趨勢參考。若無符合日期的完整來回直飛組合，該次會記錄 NO_MATCH 而不顯示虛構票價。GitHub 排程可能延遲。</p>
</main><script>
const money=n=>Number.isFinite(n)?'NT$'+Math.round(n).toLocaleString('en-US'):'—';
const airlines=['長榮 EVA Air','華航 China Airlines','星宇 STARLUX'];
const colors=['#62b6ff','#ffbd59','#ff7398'];
let data=[],chart;
function parseCSV(s){const lines=s.replace(/^\uFEFF/,'').trim().split(/\r?\n/);const heads=lines.shift().split(',');return lines.filter(Boolean).map(line=>{const vals=line.split(',');return Object.fromEntries(heads.map((h,i)=>[h,vals[i]||'']))});}
function render(){const filter=document.getElementById('airline').value;const filtered=data.filter(r=>filter==='ALL'||r.airline===filter);const valid=filtered.filter(r=>r.status==='OK'&&Number(r.price_per_person)>0);const latestByAirline=new Map();for(const r of valid){if(!latestByAirline.has(r.airline)||r.checked_at>latestByAirline.get(r.airline).checked_at)latestByAirline.set(r.airline,r)}
const recent=[...latestByAirline.values()];document.getElementById('latest').textContent=money(recent.length?Math.min(...recent.map(r=>+r.price_per_person)):NaN);document.getElementById('lowest').textContent=money(valid.length?Math.min(...valid.map(r=>+r.price_per_person)):NaN);
const dates=[...new Set(valid.map(r=>r.checked_at.slice(0,10)))].sort();const series=airlines.filter(a=>filter==='ALL'||filter===a).map((a,i)=>{const points=dates.map(day=>{const p=valid.filter(r=>r.airline===a&&r.checked_at.startsWith(day));return p.length?Math.min(...p.map(r=>+r.price_per_person)):null});return {label:a,data:points,borderColor:colors[airlines.indexOf(a)],backgroundColor:colors[airlines.indexOf(a)],tension:.25,spanGaps:false}});series.push({label:'目標 NT$26,000',data:dates.map(()=>26000),borderColor:'#a6edb0',borderDash:[6,5],pointRadius:0});
if(chart)chart.destroy();chart=new Chart(document.getElementById('chart'),{type:'line',data:{labels:dates,datasets:series},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{labels:{color:'#d8e5f6'}}},scales:{x:{ticks:{color:'#c3cee0'}},y:{ticks:{color:'#c3cee0',callback:v=>'NT$'+Number(v).toLocaleString()}}}}});
document.getElementById('rows').innerHTML=airlines.filter(a=>filter==='ALL'||filter===a).map(a=>{const r=latestByAirline.get(a);return `<tr><td>${a}</td><td>${r?money(+r.price_per_person):'—'}</td><td>${r?r.checked_at.replace('T',' ').slice(0,16):'尚無資料'}</td><td>${r?(r.outbound+' / '+r.return_flight):'—'}</td></tr>`}).join('');}
async function start(){try{const response=await fetch('./data/prices.csv?ts='+Date.now());if(!response.ok)throw Error('HTTP '+response.status);const csv=await response.text();data=parseCSV(csv);const latest=data.length?data.reduce((a,b)=>a.checked_at>b.checked_at?a:b):null;document.getElementById('updated').textContent=latest?'最近查價：'+latest.checked_at.replace('T',' ').slice(0,19)+'（台灣時間）':'尚無歷史資料，請先手動執行 GitHub Actions。';document.getElementById('airline').addEventListener('change',render);document.getElementById('download').addEventListener('click',()=>{const blob=new Blob([csv],{type:'text/csv;charset=utf-8'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='prices.csv';a.click();URL.revokeObjectURL(a.href)});render()}catch(e){document.getElementById('updated').textContent='讀取失敗：'+e.message}}
start();
</script></body></html>
